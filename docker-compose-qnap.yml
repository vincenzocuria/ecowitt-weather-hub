services:
  ecowitt-hub:
    image: python:3.11-slim
    container_name: ecowitt-hub
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      - TZ=Europe/Rome
      - TIMEZONE=Europe/Rome
      - DATA_DIR=/data
      - SOIL_MOISTURE_LOW_THRESHOLD=25.0
      - LIGHTNING_MAX_DISTANCE_KM=30.0
      - TEMP_FREEZE_THRESHOLD_C=1.0
      - TEMP_HEAT_THRESHOLD_C=38.0
      - LATITUDE=39.623928
      - LONGITUDE=16.504933
      - NTFY_TOPIC=ecowitt_weather_alerts_curia
    volumes:
      - ecowitt-data:/data
    command: >
      sh -c "pip install --no-cache-dir fastapi uvicorn requests python-multipart tzdata &&
             python -c \"import base64; exec(base64.b64decode('').decode('utf-8'))\""

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-meteo
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 run --token eyJhIjoiYTg0MDBlNDE5ZWZmNTMwMzExNzI1ZTRiNDNkNWM0ZjAiLCJ0IjoiZmY2ZGY3M2ItZmJhMC00MmE0LTk2NTEtYjVmNWFjYTJlNGNmIiwicyI6Ik1UWXlZbVZoTjJNdFkyRTJPUzAwWVRRd0xXSm1Zamt0WkdReE1qSTJPR1ZpTXpCayJ9

volumes:
  ecowitt-data:
