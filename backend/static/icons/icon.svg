<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1e1b4b" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- Tetto staccato dal corpo: casa moderna -->
  <path d="M104 262 L256 134 L408 262" fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" filter="url(#sh)"/>
  <!-- Corpo della casa -->
  <path d="M256 184 L362 273 L362 382 Q362 396 348 396 L164 396 Q150 396 150 382 L150 273 Z" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round" filter="url(#sh)"/>
  <!-- Segnale "smart" -->
  <g fill="none" stroke="url(#wave)" stroke-width="19" stroke-linecap="round">
    <path d="M227.7 325.7 A40 40 0 0 1 284.3 325.7"/>
    <path d="M204.0 302.0 A73.5 73.5 0 0 1 308.0 302.0"/>
  </g>
  <circle cx="256" cy="360" r="15" fill="url(#lamp)"/>
</svg>
