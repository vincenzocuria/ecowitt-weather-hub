<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.45" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="307" cy="220" r="102" fill="url(#sun)"/>
  <g filter="url(#shadow)" fill="url(#cloud)">
    <rect x="97" y="286" width="317" height="95" rx="47.5"/>
    <circle cx="192" cy="300" r="63"/>
    <circle cx="275" cy="258" r="86"/>
    <circle cx="351" cy="310" r="54"/>
  </g>
</svg>
