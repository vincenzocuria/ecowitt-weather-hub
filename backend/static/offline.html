<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b1120">
    <title>Weather Hub · Offline</title>
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            background: #0b1120; color: #e2e8f0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            padding: 24px env(safe-area-inset-right) 24px env(safe-area-inset-left);
        }
        .card {
            max-width: 380px; text-align: center; padding: 32px 24px;
            background: #131b2e; border: 1px solid rgba(148, 163, 184, 0.15); border-radius: 20px;
        }
        .icon { font-size: 52px; line-height: 1; }
        h1 { font-size: 1.3rem; margin: 16px 0 8px; }
        p { color: #94a3b8; line-height: 1.5; margin: 0 0 24px; }
        button {
            background: #38bdf8; color: #0b1120; border: 0; border-radius: 12px;
            padding: 12px 22px; font-size: 1rem; font-weight: 600; cursor: pointer;
        }
        button:focus-visible { outline: 3px solid #e2e8f0; outline-offset: 2px; }
        @media (prefers-color-scheme: light) {
            :root { color-scheme: light; }
            body { background: #eef2f7; color: #0f172a; }
            .card { background: #ffffff; border-color: #dbe3ec; }
            p { color: #475569; }
            button { background: #075985; color: #ffffff; }
            button:focus-visible { outline-color: #0f172a; }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="icon" aria-hidden="true">📡</div>
        <h1>Hub non raggiungibile</h1>
        <p>Il dispositivo è offline oppure il server meteo non risponde. I dati torneranno appena la connessione sarà ripristinata.</p>
        <button type="button" onclick="location.reload()">Riprova</button>
    </main>
    <script>
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
